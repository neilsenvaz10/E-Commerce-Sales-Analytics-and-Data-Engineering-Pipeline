# Local PostgreSQL data warehouse for the e-commerce analytics pipeline.
# Settings come from .env (Git-ignored); see .env.example for the variable names.
#
#   docker compose up -d warehouse-postgres      start
#   docker compose ps                            status / health
#   docker compose stop warehouse-postgres       stop (data is kept)
#
# WARNING: `docker compose down -v` deletes the data volume. Do not use -v
# unless you intend to wipe the warehouse.
#
# This is separate from the Windows PostgreSQL service that may be using port 5432.
# The warehouse is published on host port 5434, bound to localhost only.
name: ecommerce_analytics

services:
  warehouse-postgres:
    image: postgres:17
    container_name: ecommerce_warehouse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Passed to the one-time init script that creates the roles.
      AIRBYTE_DB_USER: ${AIRBYTE_DB_USER}
      AIRBYTE_DB_PASSWORD: ${AIRBYTE_DB_PASSWORD}
      DBT_DB_USER: ${DBT_DB_USER}
      DBT_DB_PASSWORD: ${DBT_DB_PASSWORD}
      STREAMLIT_DB_USER: ${STREAMLIT_DB_USER}
      STREAMLIT_DB_PASSWORD: ${STREAMLIT_DB_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - warehouse_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres/sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  warehouse_pgdata:
